apiVersion: apps/v1
kind: Deployment
metadata:
  name: rust-control-plane
  namespace: {{ include "cria.namespace" . }}
  labels:
    app: rust-control-plane
spec:
  replicas: {{ .Values.controlPlane.replicas }}
  selector:
    matchLabels:
      app: rust-control-plane
  template:
    metadata:
      labels:
        app: rust-control-plane
    spec:
      {{- if .Values.kafka.enabled }}
      initContainers:
        - name: wait-for-kafka-topics
          image: {{ .Values.kafka.image }}
          command:
            - /bin/bash
            - -ec
            - |
              deadline=$((SECONDS + {{ .Values.kafka.topicReadyTimeoutSeconds }}))
              for topic in {{ include "cria.topics" . }}; do
                until kafka-topics.sh --bootstrap-server kafka:9092 \
                  --describe --topic "${topic}" >/dev/null 2>&1; do
                  if (( SECONDS >= deadline )); then
                    echo "timed out waiting for Kafka topic ${topic}" >&2
                    exit 1
                  fi
                  sleep 2
                done
              done
      {{- end }}
      containers:
        - name: control-plane
          image: {{ .Values.controlPlane.image }}
          imagePullPolicy: {{ .Values.controlPlane.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.controlPlane.grpcPort }}
              name: grpc
            - containerPort: {{ .Values.controlPlane.httpPort }}
              name: http
            - containerPort: {{ .Values.controlPlane.metricsPort }}
              name: metrics
          env:
            - name: KAFKA_BROKERS
              value: kafka:9092
            - name: MODEL_ROUTES
              value: {{ include "cria.modelRoutes" . | quote }}
            - name: DEFAULT_MODEL_ID
              value: {{ .Values.defaultModelId | quote }}
            - name: RUST_LOG
              value: {{ .Values.controlPlane.logLevel | quote }}
            {{- if .Values.mtls.enabled }}
            - name: GRPC_TLS_CERT
              value: /etc/cria/tls/server.crt
            - name: GRPC_TLS_KEY
              value: /etc/cria/tls/server.key
            - name: GRPC_TLS_CLIENT_CA
              value: /etc/cria/tls/ca.crt
            - name: GRPC_TLS_REQUIRE_CLIENT_AUTH
              value: "true"
            {{- end }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 6
          startupProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          {{- with .Values.controlPlane.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.mtls.enabled }}
          volumeMounts:
            - name: grpc-mtls
              mountPath: /etc/cria/tls
              readOnly: true
          {{- end }}
      {{- if .Values.mtls.enabled }}
      volumes:
        - name: grpc-mtls
          secret:
            secretName: {{ .Values.mtls.existingSecret }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: rust-control-plane
  namespace: {{ include "cria.namespace" . }}
spec:
  selector:
    app: rust-control-plane
  ports:
    - name: grpc
      port: 50051
      targetPort: grpc
    - name: http
      port: 8080
      targetPort: http
    - name: metrics
      port: 9090
      targetPort: metrics
