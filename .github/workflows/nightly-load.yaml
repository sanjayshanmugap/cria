name: Nightly Load

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

jobs:
  compose-load:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install client dependencies
        working-directory: workers/python
        run: python -m pip install -r requirements.txt
      - name: Start stack
        run: docker compose up --build -d --wait
      - name: Smoke test
        run: python scripts/smoke_test.py
      - name: Run benchmark matrix
        run: |
          mkdir -p benchmark-results
          for workers in 1 2; do
            docker compose up -d --scale worker="$workers" worker
            for parallel in 1 2 4 8; do
              (
                cd workers/python
                python load_test.py \
                  --parallel "$parallel" \
                  --max-tokens 16 \
                  --repetitions 3 \
                  --worker-replicas "$workers" \
                  --output "../../benchmark-results/mock-w${workers}-c${parallel}.json"
              )
            done
          done
      - name: Publish job summary
        run: |
          python scripts/summarize_benchmarks.py benchmark-results \
            --output benchmark-results/summary.md
          cat benchmark-results/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cria-benchmarks-${{ github.sha }}
          path: benchmark-results/
          retention-days: 30
      - name: Stop stack
        if: always()
        run: docker compose down -v
