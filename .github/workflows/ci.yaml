name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: control-plane
    steps:
      - uses: actions/checkout@v4
      - name: Install librdkafka build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config libssl-dev libcurl4-openssl-dev libsasl2-dev zlib1g-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Check formatting
        run: cargo fmt --check
      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Run tests
        run: cargo test

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run ruff
        run: ruff check .
      - name: Run tests
        run: pytest tests
      - name: Compile scripts
        run: python -m compileall inference_worker client.py load_test.py

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build

  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install smoke-test dependencies
        run: python -m pip install grpcio grpcio-tools protobuf
      - name: Start integration stack
        run: |
          docker compose \
            -f docker-compose.yaml \
            -f docker-compose.integration.yaml \
            up --build -d --wait
      - name: Verify completion, status, cancellation, and model routing
        run: |
          python scripts/smoke_test.py \
            --model-id mock \
            --model-id mock-secondary \
            --timeout-seconds 60
      - name: Show service logs
        if: failure()
        run: |
          docker compose \
            -f docker-compose.yaml \
            -f docker-compose.integration.yaml \
            logs --no-color
      - name: Stop integration stack
        if: always()
        run: |
          docker compose \
            -f docker-compose.yaml \
            -f docker-compose.integration.yaml \
            down -v
